<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Application - Community Transports</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="applicationForm" class="min-h-screen py-12 px-4">
        <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-lg">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-900">Driver Application</h2>
                <button onclick="logout()" class="text-gray-600 hover:text-gray-900">Logout</button>
            </div>
            
            <form id="driverApplicationForm" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Legal First Name *</label>
                        <input type="text" id="firstName" name="firstName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Legal Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address *</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
>
                </div>

                <div class="space-y-4">
                    <div class="border-l-4 border-indigo-500 pl-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Are you 21 years old or older? *</label>
                        <div class="space-x-4">
                            <label><input type="radio" name="over21" value="yes" required class="mr-2">Yes</label>
                            <label><input type="radio" name="over21" value="no" required class="mr-2">No</label>
                        </div>
                    </div>

                    <div class="border-l-4 border-indigo-500 pl-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Do you have a valid driver's license? *</label>
                        <div class="space-x-4">
                            <label><input type="radio" name="validLicense" value="yes" required class="mr-2">Yes</label>
                            <label><input type="radio" name="validLicense" value="no" required class="mr-2">No</label>
                        </div>
                    </div>

                    <div class="border-l-4 border-indigo-500 pl-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Is your vehicle a 4-door car, van, or SUV less than 15 years old? *</label>
                        <div class="space-x-4">
                            <label><input type="radio" name="validVehicle" value="yes" required class="mr-2">Yes</label>
                            <label><input type="radio" name="validVehicle" value="no" required class="mr-2">No</label>
                        </div>
                    </div>

                    <div class="border-l-4 border-indigo-500 pl-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Is your vehicle registered in Texas? *</label>
                        <div class="space-x-4">
                            <label><input type="radio" name="texasRegistered" value="yes" required class="mr-2">Yes</label>
                            <label><input type="radio" name="texasRegistered" value="no" required class="mr-2">No</label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">School Districts You Can Service * (Select all that apply)</label>
                    <div id="districtsList" class="grid md:grid-cols-2 gap-2 max-h-64 overflow-y-auto border border-gray-300 rounded-lg p-4"></div>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg">
                    <label class="flex items-start">
                        <input type="checkbox" id="consent" name="consent" required class="mr-3 mt-1">
                        <span class="text-sm text-gray-700">
                            I consent to Community Transports collecting and storing my personal information, and I understand that employment is contingent upon passing required drug testing and background checks. I have read and agree to the Privacy Policy and Terms of Service. *
                        </span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardView" class="hidden min-h-screen py-8 px-4">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-gray-900">My Application</h2>
                    <button onclick="logout()" class="text-gray-600 hover:text-gray-900">Logout</button>
                </div>

                <div class="mb-6">
                    <div id="statusBadge" class="inline-block px-4 py-2 rounded-full font-semibold"></div>
                </div>

                <div id="applicationDetails"></div>
            </div>
        </div>
    </div>

    <script>
        const DISTRICTS = [
            'Aldine ISD', 'Alief ISD', 'Alvin ISD', 'Angleton ISD, 'Austin ISD, 'Barbers Hill ISD', 
            'Bastrop ISD', Boling ISD', 'Brazosport ISD', 'Channelview ISD',
            'Clear Creek ISD', 'Conroe ISD', 'Crosby ISD', 'Cypress-Fairbanks ISD', 'Dayton ISD',
            'Deer Park ISD', 'Dickinson ISD', 'Fort Bend ISD', 'Friendswood ISD', 'Frisco ISD', 'Galena Park ISD',
            'Galveston ISD', 'Goose Creek CISD', 'Harmony Katy', 'Harmony Science', 'Harmony Tech', 'Hitchcock ISD', 'Houston ISD', 
            'Huffman ISD', 'Humble ISD', 'Katy ISD', 'KIPP Schools', 'Klein ISD',
            'Lamar Consolidated ISD', 'LaPorte ISD', 'Magnolia ISD', 'Montgomery ISD', 
            'New Caney ISD', 'Pasadena ISD', 'Pearland ISD', 'Round Rock ISD', 'Sealy ISD',
            'Sheldon ISD', 'Spring ISD', 'Spring Branch ISD', 'Texas City ISD', 'Tomball ISD', 'Waller ISD', 'Willis ISD'
        ];

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        function loadDistricts() {
            const container = document.getElementById('districtsList');
            DISTRICTS.forEach(district => {
                const label = document.createElement('label');
                label.className = 'flex items-center';
                label.innerHTML = `
                    <input type="checkbox" name="districts" value="${district}" class="mr-2">
                    <span class="text-sm">${district}</span>
                `;
                container.appendChild(label);
            });
        }

        function loadApplication() {
            const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
            if (!user.email) {
                // Show a message instead of redirecting immediately
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 px-4">
                        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                            <h2 class="text-2xl font-bold text-gray-900 mb-4">Please Log In</h2>
                            <p class="text-gray-600 mb-6">You need to be logged in to access this page.</p>
                            <a href="index.html" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                                Go to Login
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            document.getElementById('email').value = user.email;

            const application = JSON.parse(localStorage.getItem('application:' + user.email) || 'null');
            
            if (application) {
                showDashboard(application);
            } else {
                document.getElementById('applicationForm').classList.remove('hidden');
                document.getElementById('dashboardView').classList.add('hidden');
            }
        }

        function showDashboard(application) {
            document.getElementById('applicationForm').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');

            const statusBadge = document.getElementById('statusBadge');
            if (application.status === 'Eligible') {
                statusBadge.className = 'inline-block px-4 py-2 rounded-full font-semibold bg-green-100 text-green-800';
            } else {
                statusBadge.className = 'inline-block px-4 py-2 rounded-full font-semibold bg-amber-100 text-amber-800';
            }
            statusBadge.textContent = 'Status: ' + application.status;

            let detailsHTML = `
                <div class="grid md:grid-cols-2 gap-6 mb-8">
                    <div>
                        <h3 class="font-semibold text-gray-700 mb-2">Personal Information</h3>
                        <p class="text-gray-600">Name: ${application.firstName} ${application.lastName}</p>
                        <p class="text-gray-600">Email: ${application.email}</p>
                        <p class="text-gray-600">Submitted: ${new Date(application.submittedAt).toLocaleDateString()}</p>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-700 mb-2">Eligibility</h3>
                        <p class="text-gray-600">Age 21+: ${application.over21 === 'yes' ? '✓' : '✗'}</p>
                        <p class="text-gray-600">Valid License: ${application.validLicense === 'yes' ? '✓' : '✗'}</p>
                        <p class="text-gray-600">Valid Vehicle: ${application.validVehicle === 'yes' ? '✓' : '✗'}</p>
                        <p class="text-gray-600">TX Registered: ${application.texasRegistered === 'yes' ? '✓' : '✗'}</p>
                    </div>
                </div>
            `;

            if (application.status === 'Eligible') {
                detailsHTML += `
                    <div class="mb-8">
                        <h3 class="font-semibold text-gray-700 mb-4">Verification Status</h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <span>Drug Test (Clearview Testing)</span>
                                ${application.verifications.drugTest ? 
                                    '<span class="text-green-600">✓ Complete</span>' : 
                                    '<a href="https://clearviewtesting.com" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-medium">Complete ($25)</a>'}
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <span>Background Check (Identogo)</span>
                                ${application.verifications.backgroundCheck ? 
                                    '<span class="text-green-600">✓ Complete</span>' : 
                                    '<a href="https://www.identogo.com" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-medium">Complete ($37)</a>'}
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <span>English Validation (Contractor Compliance)</span>
                                ${application.verifications.englishValidation ? 
                                    '<span class="text-green-600">✓ Complete</span>' : 
                                    '<a href="https://contractorcompliance.io" target="_blank" class="text-indigo-600 hover:text-indigo-800 font-medium">Complete</a>'}
                            </div>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h3 class="font-semibold text-gray-700 mb-2">Districts Selected</h3>
                        <div class="flex flex-wrap gap-2">
                            ${application.districts.map(d => `<span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm">${d}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (application.adminNotes) {
                detailsHTML += `
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <h3 class="font-semibold text-gray-700 mb-2">Admin Notes</h3>
                        <p class="text-gray-600">${application.adminNotes}</p>
                    </div>
                `;
            }

            document.getElementById('applicationDetails').innerHTML = detailsHTML;
        }

        document.getElementById('driverApplicationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const formData = new FormData(e.target);
            
            const districts = Array.from(document.querySelectorAll('input[name="districts"]:checked')).map(cb => cb.value);
            
            const eligible = formData.get('over21') === 'yes' && 
                           formData.get('validLicense') === 'yes' && 
                           formData.get('validVehicle') === 'yes' && 
                           formData.get('texasRegistered') === 'yes';

            const application = {
                firstName: formData.get('firstName') || document.getElementById('firstName').value,
                lastName: formData.get('lastName') || document.getElementById('lastName').value,
                email: user.email,
                over21: formData.get('over21'),
                validLicense: formData.get('validLicense'),
                validVehicle: formData.get('validVehicle'),
                texasRegistered: formData.get('texasRegistered'),
                districts: districts,
                consent: document.getElementById('consent').checked,
                status: eligible ? 'Eligible' : 'Not Eligible',
                submittedAt: new Date().toISOString(),
                verifications: {
                    drugTest: false,
                    backgroundCheck: false,
                    englishValidation: false
                },
                adminNotes: ''
            };

            localStorage.setItem('application:' + user.email, JSON.stringify(application));
            showDashboard(application);
            // Send email notification
try {
  const res = await fetch("/api/applications", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(application),
  });

  const result = await res.json();

  if (!result.ok) {
    console.error(result);
    alert("Application saved, but email notification failed.");
  }
} catch (err) {
  console.error(err);
  alert("Application saved, but email notification failed.");
}
        loadDistricts();
        loadApplication();
    </script>
</body>
</html>
